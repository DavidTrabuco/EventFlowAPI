services:
  eventflow-api:
    build:
      context: .
      dockerfile: EventFlow/Dockerfile
    depends_on:
      - postgres
    # O depends_on so espera o container do Postgres iniciar, nao o banco
    # aceitar conexoes. Se a API subir antes e cair no MigrateAsync do
    # DbSeeder, o Docker reinicia ela ate o banco responder.
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      # Sem isso, o ASP.NET Core assume "Production" dentro do container
      # (o Visual Studio injeta "Development" por voce quando roda por la,
      # mas o Docker nao faz esse favor). Sem "Development", o bloco
      # if (app.Environment.IsDevelopment()) do Program.cs nunca entra,
      # e o Swagger (/swagger) simplesmente nao existe.
      - ASPNETCORE_ENVIRONMENT=Development
      # Convencao do ASP.NET Core: "__" vira ":" na configuracao.
      # "postgres" aqui e o NOME DO SERVICO, nao "localhost" - dentro da rede
      # interna do Docker Compose, os containers se enxergam pelo nome do
      # servico, nao pelo localhost de cada um (cada container tem o seu).
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=eventflow;Username=eventflow;Password=eventflow
      - Jwt__Key=${JWT_KEY}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Email__From=${EMAIL_FROM}
      - Email__AppPassword=${EMAIL_APP_PASSWORD}
      # So HTTP no Docker local: HTTPS dentro do container exigiria exportar o
      # certificado de dev pra .pfx e montar aqui. Em producao quem cuida do
      # HTTPS e o que fica na frente da API (load balancer, proxy).

  postgres:
    image: postgres:15.3-alpine
    environment:
      - POSTGRES_USER=eventflow
      - POSTGRES_PASSWORD=eventflow
      - POSTGRES_DB=eventflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
