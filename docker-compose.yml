services:
  eventflow-api:
    build:
      context: .
      dockerfile: EventFlow/Dockerfile
    depends_on:
      # So sobe a API depois que o healthcheck do Postgres passar - sem isso
      # o compose so espera o container iniciar, nao o banco aceitar conexoes.
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      # Sem isso, o ASP.NET Core assume "Production" dentro do container
      # (o Visual Studio injeta "Development" por voce quando roda por la,
      # mas o Docker nao faz esse favor). Sem "Development", o bloco
      # if (app.Environment.IsDevelopment()) do Program.cs nunca entra,
      # e o Swagger (/swagger) simplesmente nao existe.
      - ASPNETCORE_ENVIRONMENT=Development
      # Convencao do ASP.NET Core: "__" vira ":" na configuracao.
      # "postgres" aqui e o NOME DO SERVICO, nao "localhost" - dentro da rede
      # interna do Docker Compose, os containers se enxergam pelo nome do
      # servico, nao pelo localhost de cada um (cada container tem o seu).
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=eventflow;Username=eventflow;Password=eventflow
      - Jwt__Key=${JWT_KEY}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      # HTTPS local: o container nao enxerga o repositorio de certificados do
      # Windows, entao o certificado de dev e exportado pra um .pfx
      # (dotnet dev-certs https -ep %USERPROFILE%\.aspnet\https\eventflow.pfx -p <senha>)
      # e montado em /https. Com a porta HTTPS definida, o UseHttpsRedirection
      # passa a redirecionar o 8080 pro 8081.
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/eventflow.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
    volumes:
      - ${USERPROFILE}/.aspnet/https:/https:ro

  postgres:
    image: postgres:15.3-alpine
    environment:
      - POSTGRES_USER=eventflow
      - POSTGRES_PASSWORD=eventflow
      - POSTGRES_DB=eventflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d eventflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
